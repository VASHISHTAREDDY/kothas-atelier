<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" style="font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#ffffff;">
  <defs>
    <marker id="v-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1b1b1e"/>
    </marker>
    <pattern id="wood-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b48356" stroke-width="1.8" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="green-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2d6a4f" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Outer Boundary Frame -->
  <rect x="1" y="1" width="678" height="438" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Top Title Strip -->
  <rect x="1" y="1" width="678" height="48" fill="#fafafa"/>
  <line x1="1" y1="49" x2="679" y2="49" stroke="#e4e4e7" stroke-width="1"/>
  <text x="22" y="23" font-size="12" font-weight="700" fill="#1b1b1e" letter-spacing="1.4">VILLA 111 — RESIDENCE, PLOT 111</text>
  <text x="22" y="39" font-size="9" font-weight="600" fill="#6b7280" letter-spacing="0.5">MODERN LUXURY RESIDENTIAL ARCHITECTURE &#8226; 7,461 SQ. FT. &#8226; HYDERABAD, INDIA</text>

  <!-- Compass / North Indicator -->
  <g transform="translate(636,25)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.2"/>
    <path d="M 0 -9 L 4.5 5 L 0 2 L -4.5 5 Z" fill="#1b1b1e"/>
    <text x="-23" y="4" font-size="9" font-weight="700" fill="#1b1b1e" letter-spacing="1">N</text>
  </g>

  <!-- LEFT PANEL: VOLUMETRIC MASSING & INTERLOCKING GEOMETRY -->
  <text x="24" y="74" font-size="9.5" font-weight="700" fill="#1b1b1e" letter-spacing="1.2">VOLUMETRIC MASSING &amp; CANTILEVERS</text>

  <!-- Section Axis Ground Line -->
  <line x1="24" y1="400" x2="296" y2="400" stroke="#1b1b1e" stroke-width="1.5"/>
  <text x="24" y="416" font-size="7.5" font-weight="600" fill="#6b7280">&#177; 0.00 M GROUND DATUM &#8226; PERIMETER LANDSCAPING</text>

  <!-- Volumetric Block 1: Stilt Floor (Level 00) -->
  <rect x="38" y="324" width="236" height="74" fill="#f8f9fa" stroke="#1b1b1e" stroke-width="1.4"/>
  <!-- Stilt Columns -->
  <rect x="52" y="326" width="10" height="72" fill="#1b1b1e" fill-opacity="0.85"/>
  <rect x="120" y="326" width="10" height="72" fill="#1b1b1e" fill-opacity="0.85"/>
  <rect x="190" y="326" width="10" height="72" fill="#1b1b1e" fill-opacity="0.85"/>
  <rect x="256" y="326" width="10" height="72" fill="#1b1b1e" fill-opacity="0.85"/>
  <!-- Stilt Label -->
  <rect x="68" y="352" width="116" height="20" fill="#ffffff" stroke="#e4e4e7" stroke-width="0.8"/>
  <text x="126" y="366" font-size="8" font-weight="700" fill="#1b1b1e" text-anchor="middle">STILT LEVEL &#8226; 2,028 SQ. FT.</text>

  <!-- Volumetric Block 2: First Floor (Level 01) with Left Cantilever Overhang -->
  <rect x="28" y="246" width="224" height="74" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.8"/>
  <!-- Warm Wood Soffit Underneath Overhang -->
  <rect x="28" y="316" width="224" height="6" fill="url(#wood-hatch)" stroke="#b48356" stroke-width="0.8"/>
  <text x="32" y="312" font-size="6.8" font-weight="700" fill="#b48356">WARM WOOD-FINISH SOFFIT</text>
  <!-- Cantilever Bracket / Accent Frame -->
  <line x1="28" y1="246" x2="28" y2="320" stroke="#1b1b1e" stroke-width="3"/>
  <!-- Glazing Cutout -->
  <rect x="42" y="254" width="80" height="48" fill="#f0f7f7" stroke="#1b1b1e" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="82" y="278" font-size="7.5" font-weight="600" fill="#1b1b1e" text-anchor="middle">CORNER GLAZING</text>
  <text x="82" y="290" font-size="6.8" font-weight="500" fill="#6b7280" text-anchor="middle">SHADED LIVING</text>
  <!-- First Floor Title -->
  <text x="180" y="276" font-size="8.5" font-weight="700" fill="#1b1b1e" text-anchor="middle">FIRST FLOOR</text>
  <text x="180" y="290" font-size="7.5" font-weight="600" fill="#4b5563" text-anchor="middle">1,750 SQ. FT.</text>

  <!-- Volumetric Block 3: Second Floor (Level 02) Interlocking Shifted Mass -->
  <rect x="48" y="166" width="242" height="76" fill="#fcfcfc" stroke="#1b1b1e" stroke-width="1.8"/>
  <!-- Cantilever Overhang on Right -->
  <rect x="246" y="238" width="44" height="6" fill="url(#wood-hatch)" stroke="#b48356" stroke-width="0.8"/>
  <!-- Bold White Interlocking Frame Outline -->
  <rect x="44" y="162" width="248" height="82" fill="none" stroke="#1b1b1e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Deep Recessed Balcony & Vertical Greenery -->
  <rect x="184" y="174" width="94" height="58" fill="#f4faf6" stroke="#2d6a4f" stroke-width="1"/>
  <rect x="184" y="222" width="94" height="10" fill="url(#green-dots)"/>
  <text x="231" y="196" font-size="7.2" font-weight="700" fill="#2d6a4f" text-anchor="middle">RECESSED BALCONY</text>
  <text x="231" y="208" font-size="6.8" font-weight="600" fill="#2d6a4f" text-anchor="middle">&amp; VERTICAL GREENERY</text>
  <!-- Second Floor Title -->
  <text x="110" y="198" font-size="8.5" font-weight="700" fill="#1b1b1e" text-anchor="middle">SECOND FLOOR</text>
  <text x="110" y="212" font-size="7.5" font-weight="600" fill="#4b5563" text-anchor="middle">2,071 SQ. FT.</text>

  <!-- Volumetric Block 4: Terrace Floor (Level 03) -->
  <rect x="74" y="94" width="136" height="68" fill="#1b1b1e" stroke="#1b1b1e" stroke-width="1.5"/>
  <text x="142" y="122" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">TERRACE RETREAT</text>
  <text x="142" y="136" font-size="7.5" font-weight="500" fill="#d4d4d8" text-anchor="middle">1,612 SQ. FT.</text>
  <!-- Open Deck Extension -->
  <rect x="214" y="138" width="76" height="24" fill="#fafafa" stroke="#1b1b1e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="252" y="153" font-size="7" font-weight="600" fill="#1b1b1e" text-anchor="middle">OPEN SKY DECK</text>

  <!-- Vertical Core (Lift & Stairs) Running Down -->
  <line x1="146" y1="94" x2="146" y2="398" stroke="#1b1b1e" stroke-width="0.8" stroke-dasharray="2,3"/>

  <!-- Vertical Annotations / Highlights Callout -->
  <g transform="translate(24, 88)">
    <circle cx="4" cy="4" r="3" fill="#1b1b1e"/>
    <text x="12" y="7" font-size="7" font-weight="600" fill="#1b1b1e">INTERLOCKING VOLUMES</text>
  </g>

  <!-- Divider Line -->
  <line x1="312" y1="58" x2="312" y2="422" stroke="#e4e4e7" stroke-width="1"/>

  <!-- RIGHT PANEL: 4-TIER PROGRAM & AREA DISTRIBUTION -->
  <text x="330" y="74" font-size="9.5" font-weight="700" fill="#1b1b1e" letter-spacing="1.2">AREA DISTRIBUTION &amp; MULTI-TIERED LAYOUT</text>

  <!-- Level 03: Terrace Floor -->
  <g transform="translate(330, 88)">
    <rect x="0" y="0" width="326" height="70" fill="#1b1b1e" stroke="#1b1b1e" stroke-width="1"/>
    <text x="14" y="20" font-size="9.5" font-weight="700" fill="#ffffff" letter-spacing="0.6">TERRACE FLOOR &#8212; PRIVATE SKY RETREAT</text>
    <rect x="238" y="8" width="76" height="18" fill="#ffffff" rx="2"/>
    <text x="276" y="21" font-size="8.5" font-weight="700" fill="#1b1b1e" text-anchor="middle">1,612 SQ. FT.</text>
    <text x="14" y="40" font-size="8" font-weight="400" fill="#e4e4e7">Private penthouse sanctuary opening onto an open terrace deck.</text>
    <text x="14" y="55" font-size="7.8" font-weight="500" fill="#a1a1aa">Landscaped roof garden, shaded pergola lounge, and panoramic urban vistas.</text>
  </g>

  <!-- Level 02: Second Floor -->
  <g transform="translate(330, 166)">
    <rect x="0" y="0" width="326" height="74" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.4"/>
    <text x="14" y="20" font-size="9.5" font-weight="700" fill="#1b1b1e" letter-spacing="0.6">SECOND FLOOR &#8212; FAMILY RETREAT &amp; SUITES</text>
    <rect x="238" y="8" width="76" height="18" fill="#f4f4f5" stroke="#1b1b1e" stroke-width="0.8" rx="2"/>
    <text x="276" y="21" font-size="8.5" font-weight="700" fill="#1b1b1e" text-anchor="middle">2,071 SQ. FT.</text>
    <text x="14" y="40" font-size="8" font-weight="500" fill="#374151">Master bedroom suite with walk-in dressing and luxury spa bath.</text>
    <text x="14" y="54" font-size="7.8" font-weight="500" fill="#4b5563">Secondary bedroom suites, private lounge, deep recessed corner balconies.</text>
    <text x="14" y="66" font-size="7.5" font-weight="600" fill="#2d6a4f">Strategic corner glazing with integrated vertical biophilia.</text>
  </g>

  <!-- Level 01: First Floor -->
  <g transform="translate(330, 248)">
    <rect x="0" y="0" width="326" height="74" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.4"/>
    <text x="14" y="20" font-size="9.5" font-weight="700" fill="#1b1b1e" letter-spacing="0.6">FIRST FLOOR &#8212; FLUID FAMILY LIVING ZONES</text>
    <rect x="238" y="8" width="76" height="18" fill="#f4f4f5" stroke="#1b1b1e" stroke-width="0.8" rx="2"/>
    <text x="276" y="21" font-size="8.5" font-weight="700" fill="#1b1b1e" text-anchor="middle">1,750 SQ. FT.</text>
    <text x="14" y="40" font-size="8" font-weight="500" fill="#374151">Formal living lounge, central dining hall &amp; chef's show kitchen.</text>
    <text x="14" y="54" font-size="7.8" font-weight="500" fill="#4b5563">Guest suite with en-suite bath, powder room, and scullery utility.</text>
    <text x="14" y="66" font-size="7.5" font-weight="600" fill="#b48356">Deep cantilevered balconies with warm wood-finish soffits.</text>
  </g>

  <!-- Level 00: Stilt Floor -->
  <g transform="translate(330, 330)">
    <rect x="0" y="0" width="326" height="70" fill="#fafafa" stroke="#1b1b1e" stroke-width="1.2"/>
    <text x="14" y="20" font-size="9.5" font-weight="700" fill="#1b1b1e" letter-spacing="0.6">STILT FLOOR &#8212; PARKING &amp; ENTRANCE PORTAL</text>
    <rect x="238" y="8" width="76" height="18" fill="#ffffff" stroke="#1b1b1e" stroke-width="0.8" rx="2"/>
    <text x="276" y="21" font-size="8.5" font-weight="700" fill="#1b1b1e" text-anchor="middle">2,028 SQ. FT.</text>
    <text x="14" y="39" font-size="8" font-weight="500" fill="#374151">Optimized multi-vehicle covered stilt parking and secure entrance foyer.</text>
    <text x="14" y="53" font-size="7.8" font-weight="500" fill="#6b7280">Passenger elevator &amp; stair core, driver/service quarters, and utility access.</text>
  </g>

  <!-- Bottom Metric Summary Bar -->
  <g transform="translate(330, 408)">
    <rect x="0" y="0" width="326" height="22" fill="#f4f4f5" rx="2"/>
    <text x="12" y="15" font-size="8" font-weight="700" fill="#1b1b1e">TOTAL BUILT-UP AREA:</text>
    <text x="135" y="15" font-size="8.5" font-weight="700" fill="#1b1b1e">7,461 SQ. FT.</text>
    <text x="232" y="15" font-size="7.5" font-weight="600" fill="#6b7280">4 STRUCTURED TIERS</text>
  </g>
</svg>