<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" style="font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#ffffff;">
  <defs>
    <pattern id="stilt-paving" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 0 L 16 16 L 0 16 Z" fill="none" stroke="#e4e4e7" stroke-width="0.7"/>
    </pattern>
    <pattern id="stilt-grass" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#2d6a4f" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Sheet Border -->
  <rect x="10" y="10" width="780" height="500" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.2"/>
  <rect x="14" y="14" width="772" height="492" fill="none" stroke="#e4e4e7" stroke-width="0.8"/>

  <!-- Title Block Header -->
  <rect x="14" y="14" width="772" height="54" fill="#fafafa"/>
  <line x1="14" y1="68" x2="786" y2="68" stroke="#1b1b1e" stroke-width="1"/>
  <text x="32" y="38" font-size="13" font-weight="700" fill="#1b1b1e" letter-spacing="1.5">VILLA 111 &#8212; STILT FLOOR PLAN</text>
  <text x="32" y="55" font-size="9.5" font-weight="600" fill="#6b7280" letter-spacing="0.5">LEVEL 00 &#8226; AREA: 2,028 SQ. FT. &#8226; OPTIMIZED VEHICULAR PARKING &amp; SECURE ENTRANCE PORTAL</text>

  <!-- North Orientation Indicator -->
  <g transform="translate(740,41)">
    <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.2"/>
    <path d="M 0 -10 L 5 6 L 0 2 L -5 6 Z" fill="#1b1b1e"/>
    <text x="-24" y="4" font-size="9.5" font-weight="700" fill="#1b1b1e">N</text>
  </g>

  <!-- Perimeter Offsets & Landscaping -->
  <rect x="50" y="90" width="700" height="390" fill="url(#stilt-grass)" stroke="#2d6a4f" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="400" y="105" font-size="8" font-weight="600" fill="#2d6a4f" text-anchor="middle">LUSH PERIMETER LANDSCAPING &amp; PRIVACY BUFFER OFFSETS</text>

  <!-- Stilt Floor Slab Footprint (2,028 sq. ft.) -->
  <rect x="80" y="116" width="640" height="340" fill="url(#stilt-paving)" stroke="#1b1b1e" stroke-width="2"/>

  <!-- Driveway & Multi-Car Parking Bays -->
  <rect x="100" y="136" width="370" height="300" fill="#f8f9fa" stroke="#1b1b1e" stroke-width="1.2"/>
  <text x="285" y="160" font-size="10.5" font-weight="700" fill="#1b1b1e" text-anchor="middle" letter-spacing="0.8">OPTIMIZED COVERED STILT PARKING BAY</text>
  <text x="285" y="176" font-size="8.5" font-weight="500" fill="#6b7280" text-anchor="middle">MULTI-VEHICLE CAPACITY &#8226; SMOOTH TURNING RADIUS</text>

  <!-- Parking Bays Markings -->
  <g stroke="#1b1b1e" stroke-width="1" stroke-dasharray="4,4">
    <line x1="120" y1="200" x2="120" y2="410"/>
    <line x1="200" y1="200" x2="200" y2="410"/>
    <line x1="280" y1="200" x2="280" y2="410"/>
    <line x1="360" y1="200" x2="360" y2="410"/>
    <line x1="440" y1="200" x2="440" y2="410"/>
  </g>
  <text x="160" y="310" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">BAY 01</text>
  <text x="240" y="310" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">BAY 02</text>
  <text x="320" y="310" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">BAY 03</text>
  <text x="400" y="310" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">BAY 04</text>

  <!-- Main Entrance Lobby & Core -->
  <rect x="490" y="136" width="210" height="150" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.5"/>
  <rect x="490" y="136" width="210" height="28" fill="#1b1b1e"/>
  <text x="595" y="154" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">ENTRANCE FOYER &amp; LOBBY</text>
  <text x="595" y="180" font-size="8" font-weight="600" fill="#1b1b1e" text-anchor="middle">FORMAL ARRIVAL THRESHOLD</text>

  <!-- Passenger Elevator Core -->
  <rect x="506" y="200" width="70" height="68" fill="#f4f4f5" stroke="#1b1b1e" stroke-width="1.2"/>
  <line x1="506" y1="200" x2="576" y2="268" stroke="#1b1b1e" stroke-width="0.8"/>
  <line x1="576" y1="200" x2="506" y2="268" stroke="#1b1b1e" stroke-width="0.8"/>
  <text x="541" y="238" font-size="8" font-weight="700" fill="#1b1b1e" text-anchor="middle">LIFT</text>

  <!-- Staircase Hall -->
  <rect x="594" y="200" width="90" height="68" fill="#fafafa" stroke="#1b1b1e" stroke-width="1.2"/>
  <line x1="604" y1="200" x2="604" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <line x1="614" y1="200" x2="614" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <line x1="624" y1="200" x2="624" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <line x1="634" y1="200" x2="634" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <line x1="644" y1="200" x2="644" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <line x1="654" y1="200" x2="654" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <line x1="664" y1="200" x2="664" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <line x1="674" y1="200" x2="674" y2="268" stroke="#1b1b1e" stroke-width="0.6"/>
  <text x="639" y="238" font-size="7.5" font-weight="700" fill="#1b1b1e" text-anchor="middle">STAIRCASE</text>

  <!-- Driver / Staff Quarters & Facilities -->
  <rect x="490" y="300" width="110" height="136" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.2"/>
  <text x="545" y="328" font-size="8" font-weight="700" fill="#1b1b1e" text-anchor="middle">DRIVER ROOM</text>
  <text x="545" y="344" font-size="7.5" font-weight="500" fill="#6b7280" text-anchor="middle">&amp; FACILITIES</text>

  <!-- Utility / Storage Room -->
  <rect x="610" y="300" width="90" height="136" fill="#ffffff" stroke="#1b1b1e" stroke-width="1.2"/>
  <text x="655" y="328" font-size="8" font-weight="700" fill="#1b1b1e" text-anchor="middle">UTILITY /</text>
  <text x="655" y="342" font-size="8" font-weight="700" fill="#1b1b1e" text-anchor="middle">GENSET</text>

  <!-- Structural RCC Columns (Black solid squares) -->
  <g fill="#1b1b1e">
    <rect x="94" y="130" width="12" height="12"/>
    <rect x="220" y="130" width="12" height="12"/>
    <rect x="340" y="130" width="12" height="12"/>
    <rect x="460" y="130" width="12" height="12"/>
    <rect x="688" y="130" width="12" height="12"/>

    <rect x="94" y="278" width="12" height="12"/>
    <rect x="220" y="278" width="12" height="12"/>
    <rect x="340" y="278" width="12" height="12"/>
    <rect x="460" y="278" width="12" height="12"/>
    <rect x="688" y="278" width="12" height="12"/>

    <rect x="94" y="424" width="12" height="12"/>
    <rect x="220" y="424" width="12" height="12"/>
    <rect x="340" y="424" width="12" height="12"/>
    <rect x="460" y="424" width="12" height="12"/>
    <rect x="688" y="424" width="12" height="12"/>
  </g>

  <!-- Bottom Legend -->
  <rect x="14" y="474" width="772" height="32" fill="#fafafa"/>
  <text x="32" y="494" font-size="8.5" font-weight="700" fill="#1b1b1e">STILT TIER METRICS:</text>
  <text x="135" y="494" font-size="8.5" font-weight="500" fill="#4b5563">BUILT-UP AREA: <tspan font-weight="700" fill="#1b1b1e">2,028 SQ. FT.</tspan></text>
  <text x="300" y="494" font-size="8.5" font-weight="500" fill="#4b5563">VEHICLE PARKING: <tspan font-weight="700" fill="#1b1b1e">4 COVERED BAYS</tspan></text>
  <text x="470" y="494" font-size="8.5" font-weight="500" fill="#4b5563">CORE: <tspan font-weight="700" fill="#1b1b1e">HIGH-SPEED PASSENGER LIFT &amp; STAIR</tspan></text>
  <text x="760" y="494" font-size="8" font-weight="700" fill="#1b1b1e" text-anchor="end">KOTHA'S ATELIER</text>
</svg>