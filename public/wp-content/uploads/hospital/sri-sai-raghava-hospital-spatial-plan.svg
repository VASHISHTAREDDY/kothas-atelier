<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="100%" height="100%" style="background:#ffffff; font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f2f5" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1b1b1e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#3182ce" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="920" height="660" fill="#ffffff"/>
  <rect width="920" height="660" fill="url(#grid)"/>

  <!-- Outer Drawing Border -->
  <rect x="24" y="24" width="872" height="612" fill="none" stroke="#1b1b1e" stroke-width="1.5"/>
  <rect x="28" y="28" width="864" height="604" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header Title Block -->
  <rect x="28" y="28" width="864" height="52" fill="#f8f9fa"/>
  <line x1="28" y1="80" x2="892" y2="80" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="48" y="52" font-size="14" font-weight="700" fill="#1b1b1e" letter-spacing="1.5">SRI SAI RAGHAVA HOSPITAL</text>
  <text x="48" y="70" font-size="11" font-weight="500" fill="#718096" letter-spacing="0.5">CLINICAL SPATIAL LAYOUT &amp; STRUCTURAL GRID &#8226; 2,529 SFT GROUND FLOOR &amp; FIRST FLOOR</text>

  <text x="872" y="52" font-size="11" font-weight="600" fill="#1b1b1e" text-anchor="end">KOTHA&#39;S ATELIER ARCHITECTS</text>
  <text x="872" y="70" font-size="10" font-weight="400" fill="#718096" text-anchor="end">SHIVARAMPALLY, HYDERABAD</text>

  <!-- Structural Grid Column Bubbles (A-D) -->
  <g fill="#a0aec0" font-size="10" font-weight="600" text-anchor="middle">
    <circle cx="140" cy="104" r="11" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="140" y="108" fill="#4a5568">A</text>
    <circle cx="340" cy="104" r="11" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="340" y="108" fill="#4a5568">B</text>
    <circle cx="540" cy="104" r="11" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="540" y="108" fill="#4a5568">C</text>
    <circle cx="740" cy="104" r="11" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="740" y="108" fill="#4a5568">D</text>
  </g>

  <!-- Dashed Axis Lines -->
  <line x1="140" y1="117" x2="140" y2="535" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="340" y1="117" x2="340" y2="535" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="540" y1="117" x2="540" y2="535" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="740" y1="117" x2="740" y2="535" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Building Outer Boundary Wall (Masonry - Magenta #d53f8c) -->
  <rect x="130" y="135" width="620" height="375" fill="#fafafa" stroke="#d53f8c" stroke-width="3" rx="2"/>

  <!-- Main Central Corridor (Wide Emergency Circulation Axis) -->
  <rect x="130" y="295" width="620" height="70" fill="#edf2f7" stroke="none"/>
  <line x1="130" y1="295" x2="750" y2="295" stroke="#d53f8c" stroke-width="2.5" stroke-dasharray="120,45,150,45,260"/>
  <line x1="130" y1="365" x2="750" y2="365" stroke="#d53f8c" stroke-width="2.5" stroke-dasharray="80,45,140,45,310"/>
  <text x="440" y="335" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle" letter-spacing="1.5">WIDE CENTRAL CORRIDOR &#8212; EMERGENCY ORIENTATION AXIS</text>

  <!-- Corridor Flow Arrows -->
  <line x1="190" y1="330" x2="270" y2="330" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="330" x2="690" y2="330" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ROOM COMPARTMENTS -->
  
  <!-- 1. Shared Wards (North Zone, 10'-9" x 8'-5") -->
  <!-- Partition Walls (Dry-lining cement board - Blue #3182ce) -->
  <rect x="130" y="135" width="190" height="160" fill="#ffffff" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="225" y="195" font-size="12" font-weight="700" fill="#1b1b1e" text-anchor="middle">SHARED WARD 01</text>
  <text x="225" y="215" font-size="11" font-weight="600" fill="#3182ce" text-anchor="middle">10&#8242;-9&#8243; &#215; 8&#8242;-5&#8243;</text>
  <text x="225" y="232" font-size="9" font-weight="400" fill="#718096" text-anchor="middle">Perimeter Natural Lighting</text>

  <rect x="320" y="135" width="190" height="160" fill="#ffffff" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="415" y="195" font-size="12" font-weight="700" fill="#1b1b1e" text-anchor="middle">SHARED WARD 02</text>
  <text x="415" y="215" font-size="11" font-weight="600" fill="#3182ce" text-anchor="middle">10&#8242;-9&#8243; &#215; 8&#8242;-5&#8243;</text>
  <text x="415" y="232" font-size="9" font-weight="400" fill="#718096" text-anchor="middle">Perimeter Cross-Ventilation</text>

  <!-- 2. Centralized Nurse Station & Recovery Bay Observation Core -->
  <rect x="510" y="135" width="240" height="160" fill="#ebf8ff" stroke="#3182ce" stroke-width="2.5"/>
  <circle cx="630" cy="205" r="30" fill="#bee3f8" stroke="#3182ce" stroke-width="1.5"/>
  <text x="630" y="202" font-size="10.5" font-weight="700" fill="#2b6cb0" text-anchor="middle">NURSE</text>
  <text x="630" y="216" font-size="10.5" font-weight="700" fill="#2b6cb0" text-anchor="middle">STATION</text>
  <text x="630" y="252" font-size="9.5" font-weight="600" fill="#2c5282" text-anchor="middle">Line-of-Sight Patient Monitoring</text>
  <!-- Sightline rays -->
  <line x1="600" y1="190" x2="475" y2="160" stroke="#63b3ed" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="220" x2="475" y2="250" stroke="#63b3ed" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
  <line x1="630" y1="237" x2="630" y2="290" stroke="#63b3ed" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>

  <!-- 3. Dedicated Supply Storage Rooms (South-West Zone, 9'-1" x 12'-0") -->
  <rect x="130" y="365" width="180" height="145" fill="#ffffff" stroke="#3182ce" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="220" y="425" font-size="12" font-weight="700" fill="#1b1b1e" text-anchor="middle">SUPPLY STORAGE</text>
  <text x="220" y="445" font-size="11" font-weight="600" fill="#3182ce" text-anchor="middle">9&#8242;-1&#8243; &#215; 12&#8242;-0&#8243;</text>
  <text x="220" y="462" font-size="9" font-weight="400" fill="#718096" text-anchor="middle">Dedicated Asset Utilities</text>

  <!-- 4. Public Reception & Entrance Vestibule (South Center, 2,529 SFT Layer) -->
  <rect x="310" y="365" width="260" height="145" fill="#ffffff" stroke="#d53f8c" stroke-width="2"/>
  <!-- Reception desk arc -->
  <path d="M 380 440 Q 440 410 500 440" fill="none" stroke="#1b1b1e" stroke-width="3" stroke-linecap="round"/>
  <text x="440" y="465" font-size="12" font-weight="700" fill="#1b1b1e" text-anchor="middle">PUBLIC RECEPTION &amp; ADMISSIONS</text>
  <text x="440" y="483" font-size="10" font-weight="500" fill="#718096" text-anchor="middle">Ground Floor Public Access &#8226; 2,529 SFT</text>

  <!-- 5. Stair Core & Main Vertical Shaft -->
  <rect x="570" y="365" width="180" height="145" fill="#f7fafc" stroke="#d53f8c" stroke-width="2"/>
  <!-- Stair steps representation -->
  <line x1="585" y1="400" x2="655" y2="400" stroke="#718096" stroke-width="1.5"/>
  <line x1="585" y1="415" x2="655" y2="415" stroke="#718096" stroke-width="1.5"/>
  <line x1="585" y1="430" x2="655" y2="430" stroke="#718096" stroke-width="1.5"/>
  <line x1="585" y1="445" x2="655" y2="445" stroke="#718096" stroke-width="1.5"/>
  <line x1="585" y1="460" x2="655" y2="460" stroke="#718096" stroke-width="1.5"/>
  <text x="662" y="428" font-size="11" font-weight="700" fill="#1b1b1e">STAIR CORE</text>
  <text x="662" y="444" font-size="9" font-weight="500" fill="#718096">Vertical Access</text>

  <!-- Subterranean Cellar Ramp Access Indicator -->
  <g transform="translate(440, 510)">
    <rect x="-75" y="8" width="150" height="34" fill="#1b1b1e" rx="4"/>
    <text x="0" y="25" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">CELLAR RAMP &#8595;</text>
    <text x="0" y="36" font-size="8" font-weight="400" fill="#cbd5e0" text-anchor="middle">Subterranean Parking &amp; Service Storage</text>
  </g>

  <!-- REINFORCED CONCRETE COLUMNS (Red #e53e3e squares on structural grid intersections) -->
  <g fill="#e53e3e" stroke="#9b2c2c" stroke-width="1">
    <rect x="132" y="137" width="16" height="16"/>
    <rect x="332" y="137" width="16" height="16"/>
    <rect x="532" y="137" width="16" height="16"/>
    <rect x="732" y="137" width="16" height="16"/>

    <rect x="132" y="287" width="16" height="16"/>
    <rect x="332" y="287" width="16" height="16"/>
    <rect x="532" y="287" width="16" height="16"/>
    <rect x="732" y="287" width="16" height="16"/>

    <rect x="132" y="360" width="16" height="16"/>
    <rect x="332" y="360" width="16" height="16"/>
    <rect x="532" y="360" width="16" height="16"/>
    <rect x="732" y="360" width="16" height="16"/>

    <rect x="132" y="492" width="16" height="16"/>
    <rect x="332" y="492" width="16" height="16"/>
    <rect x="532" y="492" width="16" height="16"/>
    <rect x="732" y="492" width="16" height="16"/>
  </g>

  <!-- TECHNICAL LEGEND (Footer) -->
  <rect x="28" y="560" width="864" height="72" fill="#f8f9fa"/>
  <line x1="28" y1="560" x2="892" y2="560" stroke="#e2e8f0" stroke-width="1"/>

  <g transform="translate(48, 582)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1b1b1e" letter-spacing="1">STRUCTURAL GRID LEGEND:</text>
    
    <!-- Legend Item 1: RC Column -->
    <rect x="200" y="-11" width="12" height="12" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1"/>
    <text x="220" y="0" font-size="11" font-weight="600" fill="#2d3748">RC Columns (Red)</text>

    <!-- Legend Item 2: Masonry Walls -->
    <line x1="390" y1="-5" x2="420" y2="-5" stroke="#d53f8c" stroke-width="4"/>
    <text x="428" y="0" font-size="11" font-weight="600" fill="#2d3748">Masonry Walls (Magenta)</text>

    <!-- Legend Item 3: Dry-lining -->
    <line x1="620" y1="-5" x2="650" y2="-5" stroke="#3182ce" stroke-width="2.5" stroke-dasharray="6,3"/>
    <text x="658" y="0" font-size="11" font-weight="600" fill="#2d3748">Dry-Lining Partitions (Blue)</text>
  </g>

  <g transform="translate(48, 614)">
    <!-- North Arrow -->
    <g transform="translate(0, -3)">
      <circle cx="10" cy="5" r="10" fill="none" stroke="#718096" stroke-width="1"/>
      <polygon points="10,-2 13,8 10,6 7,8" fill="#1b1b1e"/>
      <text x="10" y="-6" font-size="8" font-weight="700" fill="#1b1b1e" text-anchor="middle">N</text>
    </g>
    <text x="28" y="6" font-size="10" font-weight="500" fill="#718096">South-Facing Solar Exposure &#8226; Deep Recessed Glazing &#8226; Rajendranagar, Hyderabad</text>

    <!-- Area Metadata -->
    <text x="824" y="6" font-size="10" font-weight="600" fill="#4a5568" text-anchor="end">Ground Floor: 2,529 SFT &#8226; Subterranean Cellar &#8226; First Floor Recovery</text>
  </g>
</svg>